# @package _global_

launcher:
  num_nodes: 1
  gpus_per_node: 8
  experiment_log_dir: ./logs/robotseg

scratch:
  resolution: 1024
  train_batch_size_image: 10
  train_batch_size_video: 1
  num_train_workers: 10
  num_frames: 7
  max_num_objects: 1
  object_token_num: 3
  base_lr: 3.0e-4
  vision_lr: 6.0e-05
  phases_per_epoch: 1
  num_epochs: 25

dataset:
  root: /workspace/RobotSeg/dataset
  roboengine_img_folder: ${dataset.root}/RoboEngine/train/image
  roboengine_gt_folder: ${dataset.root}/RoboEngine/train/mask
  roboengine_file_list_txt: txt/roboengine_train_list.txt
  vrs_img_folder: ${dataset.root}/VRS/train/image
  vrs_gt_folder: ${dataset.root}/VRS/train/mask_gt_dinov3
  vrs_file_list_txt: txt/vrs_train_list.txt

# Video transforms
vos:
  train_transforms:
    - _target_: train.dataset.transforms.ComposeAPI
      transforms:
        - _target_: train.dataset.transforms.RandomHorizontalFlip
          consistent_transform: True
        - _target_: train.dataset.transforms.RandomAffine
          degrees: 25
          shear: 20
          image_interpolation: bilinear
          consistent_transform: True
        - _target_: train.dataset.transforms.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True
        - _target_: train.dataset.transforms.ColorJitter
          consistent_transform: True
          brightness: 0.1
          contrast: 0.03
          saturation: 0.03
          hue: null
        - _target_: train.dataset.transforms.RandomGrayscale
          p: 0.05
          consistent_transform: True
        - _target_: train.dataset.transforms.ColorJitter
          consistent_transform: False
          brightness: 0.1
          contrast: 0.05
          saturation: 0.05
          hue: null
        - _target_: train.dataset.transforms.ToTensorAPI
        - _target_: train.dataset.transforms.NormalizeAPI
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

trainer:
  _target_: train.trainer.Trainer
  mode: train_only
  max_epochs: ${times:${scratch.num_epochs},${scratch.phases_per_epoch}}
  accelerator: cuda
  seed_value: 2026

  model:
    _target_: train.model.robotseg.RobotSegTrain
    image_encoder:
      _target_: robotseg.modeling.backbones.image_encoder.ImageEncoder
      scalp: 1
      trunk:
        _target_: robotseg.modeling.backbones.hieradet.Hiera
        embed_dim: 96
        num_heads: 1
        stages: [ 1, 2, 7, 2 ]
        global_att_blocks: [ 5, 7, 9 ]
        window_pos_embed_bkg_spatial_size: [ 7, 7 ]
        drop_path_rate: 0.1
      neck:
        _target_: robotseg.modeling.backbones.image_encoder.FpnNeck
        position_encoding:
          _target_: robotseg.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 256
          normalize: true
          scale: null
          temperature: 10000
        d_model: 256
        backbone_channel_list: [768, 384, 192, 96]
        fpn_top_down_levels: [2, 3]
        fpn_interp_model: nearest

    memory_attention:
      _target_: robotseg.modeling.memory_attention_with_structure.MemoryAttention
      d_model: 256
      pos_enc_at_input: true
      layer:
        _target_: robotseg.modeling.memory_attention_with_structure.MemoryAttentionLayer
        activation: relu
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: false
        self_attention:
          _target_: robotseg.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
        d_model: 256
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        cross_attention:
          _target_: robotseg.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          rope_k_repeat: True
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
          kv_in_dim: 64
        cross_attention_structure:
          _target_: robotseg.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [ 64, 64 ]
          rope_k_repeat: True
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
          kv_in_dim: 64
      num_layers: 4

    memory_encoder:
      _target_: robotseg.modeling.memory_encoder.MemoryEncoder
      out_dim: 64
      position_encoding:
        _target_: robotseg.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 64
        normalize: true
        scale: null
        temperature: 10000
      mask_downsampler:
        _target_: robotseg.modeling.memory_encoder.MaskDownSampler
        kernel_size: 3
        stride: 2
        padding: 1
      fuser:
        _target_: robotseg.modeling.memory_encoder.Fuser
        layer:
          _target_: robotseg.modeling.memory_encoder.CXBlock
          dim: 256
          kernel_size: 7
          padding: 3
          layer_scale_init_value: 1e-6
          use_dwconv: True
        num_layers: 2

    robot_prompt_generator:
      _target_: robotseg.modeling.sam.robot_prompt_generator.RobotPromptGenerator
      embed_dim: 256
      object_token_num: ${scratch.object_token_num}

    num_maskmem: 7
    image_size: ${scratch.resolution}
    # apply scaled sigmoid on mask logits for memory encoder and directly feed input mask as output mask
    sigmoid_scale_for_mem_enc: 20.0
    sigmoid_bias_for_mem_enc: -10.0
    use_mask_input_as_output_without_sam: true
    # Memory
    directly_add_no_mem_embed: true
    no_obj_embed_spatial: true
    # use high-resolution feature map in the SAM mask decoder
    use_high_res_features_in_sam: true
    # output 3 masks on the first click on initial conditioning frames
    multimask_output_in_sam: true
    # SAM heads
    iou_prediction_use_sigmoid: True
    # cross-attend to object pointers from other frames (based on SAM output tokens) in the encoder
    use_obj_ptrs_in_encoder: true
    add_tpos_enc_to_obj_ptrs: true
    proj_tpos_enc_in_obj_ptrs: true
    use_signed_tpos_enc_to_obj_ptrs: true
    only_obj_ptrs_in_the_past_for_eval: true
    # object occlusion prediction
    pred_obj_scores: true
    pred_obj_scores_mlp: true
    fixed_no_obj_ptr: true
    # multimask tracking settings
    multimask_output_for_tracking: true
    use_multimask_token_for_obj_ptr: true
    multimask_min_pt_num: 0
    multimask_max_pt_num: 1
    use_mlp_for_obj_ptr_proj: true

    ####### Training specific params #######
    prob_to_use_robot_input_for_train: 0.4
    prob_to_use_robot_input_for_eval: 0.0
    prob_to_use_pt_input_for_train: 0.4
    prob_to_use_pt_input_for_eval: 0.0
    prob_to_use_box_input_for_train: 0.5
    prob_to_use_box_input_for_eval: 0.0
    prob_to_sample_from_gt_for_train: 0.1  # with a small prob, sampling correction points from GT mask instead of prediction errors

    num_frames_to_correct_for_train: 1
    num_frames_to_correct_for_eval: 1
    rand_frames_to_correct_for_train: False  # random #init-cond-frame ~ 2
    add_all_frames_to_correct_as_cond: True  # when a frame receives a correction click, it becomes a conditioning frame (even if it's not initially a conditioning frame)

    num_init_cond_frames_for_train: 1
    rand_init_cond_frames_for_train: False
    num_correction_pt_per_frame: 3
    use_act_ckpt_iterative_pt_sampling: false

    num_init_cond_frames_for_eval: 1

    forward_backbone_per_frame_for_eval: True

  data:
    train:
      _target_: train.dataset.vrs_datasets.TorchTrainMixedDataset
      phases_per_epoch: ${scratch.phases_per_epoch}
      batch_sizes:
        - ${scratch.train_batch_size_image}
        - ${scratch.train_batch_size_video}
      datasets:
        # image dataset: roboengine
        - _target_: train.dataset.vos_dataset.VOSDataset
          training: true
          video_dataset:
            _target_: train.dataset.vos_raw_dataset.PNGRawDataset
            img_folder: ${dataset.roboengine_img_folder}
            gt_folder: ${dataset.roboengine_gt_folder}
            file_list_txt: ${dataset.roboengine_file_list_txt}
          sampler:
            _target_: train.dataset.vos_sampler.RandomUniformSampler
            num_frames: 1
            max_num_objects: ${scratch.max_num_objects}
          transforms: ${vos.train_transforms}
        # video dataset: vrs
        - _target_: train.dataset.vos_dataset.VOSDataset
          training: true
          video_dataset:
            _target_: train.dataset.vos_raw_dataset.PNGRawDataset
            img_folder: ${dataset.vrs_img_folder}
            gt_folder: ${dataset.vrs_gt_folder}
            file_list_txt: ${dataset.vrs_file_list_txt}
          sampler:
            _target_: train.dataset.vos_sampler.BidirectionalSampler
            num_frames: ${scratch.num_frames}
            max_num_objects: ${scratch.max_num_objects}
          transforms: ${vos.train_transforms}
      shuffle: True
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn:
        _target_: train.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: train.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: train.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: 0.9
        apply_to: 'image_encoder.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.base_lr}
            end_value: ${divide:${scratch.base_lr},10}
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.vision_lr}
            end_value: ${divide:${scratch.vision_lr},10}
          param_names:
            - 'image_encoder.*'
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.1
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  loss:
    all:
      _target_: train.loss_fns_let.MultiStepMultiMasksAndIous_LET
      weight_dict:
        loss_mask: 5
        loss_dice: 1
        loss_iou: 1
        loss_class: 1
        loss_semantic: 1
        loss_patch: 1
        loss_structure: 1
      supervise_all_iou: true
      iou_use_l1_loss: true
      pred_obj_scores: true
      focal_gamma_obj_score: 0.0
      focal_alpha_obj_score: -1.0

  distributed:
    backend: nccl
    find_unused_parameters: True

  logging:
    tensorboard_writer:
      _target_: train.utils.logger.make_tensorboard_logger
      log_dir:  ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 100
      should_log: True
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 100

  # initialize from a SAM 2 checkpoint
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1 # if 0, only the last checkpoint will be saved.
    model_weight_initializer:
      _partial_: True
      _target_: train.utils.checkpoint_utils.load_state_dict_into_model
      strict: False
      ignore_unexpected_keys: null
      ignore_missing_keys: null

      state_dict:
        _target_: train.utils.checkpoint_utils.load_checkpoint_and_apply_kernels
        checkpoint_path: ../checkpoints/sam2.1_hiera_tiny.pt
        ckpt_state_dict_keys: ['model']

# SLURM args if running on a cluster
submitit:
  partition: null
  account: null
  qos: null
  cpus_per_task: 10
  use_cluster: false
  timeout_hour: 24
  name: null
  port_range: [10000, 65000]
